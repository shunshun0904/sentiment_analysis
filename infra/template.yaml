AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: 株式市場センチメント可視化 — EventBridge + Lambda + S3 (Alpha Vantage NEWS_SENTIMENT)

Parameters:
  BucketName:
    Type: String
    Description: 履歴JSONとSPAを置くS3バケット名(グローバルで一意)
  AlphaVantageKeyParam:
    Type: String
    Default: /sentiment/alphavantage/api_key
    Description: Alpha Vantageキーを格納した SSM SecureString のパラメータ名
  ScheduleExpression:
    Type: String
    Default: rate(120 minutes)
    Description: >-
      無料プランは 25 req/day。60分間隔(22回/日)では予備が3回しか残らず、
      プローブと手動実行だけで枯れた(運用初日に実際に上限到達)。
      120分間隔なら約12回/日で予備が13回残る。
      画面の5分刻みは time_published から再構成しているので細かさは落ちない。
      落ちるのは鮮度だけ(最大2時間)。短くするなら有料プラン前提。
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: >-
      JSONの取得を許すオリジン。ホームページから読むだけなら
      https://shunshun0904.github.io に絞れる。
  ArticleRetentionDays:
    Type: Number
    Default: 400
    MinValue: 2
    Description: >-
      記事単位の監査ログ(history/articles/)を残す日数。
      集計済みの系列 history/sentiment.jsonl はこの規則に触れないので、
      長期の推移は消えない。消えるのは記事レベルの細かさだけ。

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 512
    Timeout: 60

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      WebsiteConfiguration:
        IndexDocument: index.html
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        # SPAと公開JSONを静的ホスティングするため、パブリック読み取りを許可する。
        # 独自ドメイン/HTTPSが必要なら CloudFront + OAC に差し替えること。
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, HEAD]
            AllowedOrigins: [!Ref AllowedOrigin]
            AllowedHeaders: ["*"]
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          # 実行状態(last_run / seen)。消えても次の実行で作り直せる。
          # seen は48時間ぶんの重複排除キャッシュなので7日で十分。
          - Id: expire-state
            Status: Enabled
            Prefix: state/
            ExpirationInDays: 7
          # 記事単位の監査ログ。集計後は再現用の価値しかないので打ち止めにする。
          # history/sentiment.jsonl は prefix が違うので消えない。
          - Id: expire-article-log
            Status: Enabled
            Prefix: history/articles/
            ExpirationInDays: !Ref ArticleRetentionDays
          # 書き損じ(マルチパートの残骸)を溜めない
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 3

  PublicReadPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Statement:
          # 公開するのは SPA と public/ 配下のみ。
          # state/(実行状態) history/(監査ログ) observe/(ソース分布)は非公開。
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource:
              - !Sub "arn:aws:s3:::${BucketName}/index.html"
              - !Sub "arn:aws:s3:::${BucketName}/public/*"

  CollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-collector"
      # src/ をそのままパッケージのルートにする(モジュールはフラットに import している)
      CodeUri: ../src
      Handler: handler.lambda_handler
      Description: ニュース取得→重複排除→集計→S3更新
      # 単一ジョブ。同時実行を1に固定して state/ の競合とクォータの二重消費を防ぐ
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          # 既定は fs（GitHub Actions 用）なので、Lambda では明示的に s3 を選ぶ
          STORE_BACKEND: s3
          S3_BUCKET: !Ref BucketName
          AV_KEY_SSM: !Ref AlphaVantageKeyParam
          # SPAのポーリング間隔。ScheduleExpression と揃えること
          UPDATE_INTERVAL_SECONDS: "7200"
          LOG_LEVEL: INFO
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref BucketName
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AlphaVantageKeyParam}"
      Events:
        Tick:
          Type: Schedule
          Properties:
            Schedule: !Ref ScheduleExpression
            Description: 120分間隔のセンチメント更新

  # ログは放っておくと無期限に残る。14日で足りる(障害の調査はその場でやる)
  CollectorLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-collector"
      RetentionInDays: 14

  # 失敗が続いたら気づけるようにしておく(無料枠内)
  # 60分間隔なので、3回失敗＝3時間止まっている。評価期間を4時間に合わせる。
  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: センチメント収集Lambdaが連続失敗
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CollectorFunction
      Statistic: Sum
      Period: 14400
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  WebsiteURL:
    Description: SPAのURL
    Value: !GetAtt DataBucket.WebsiteURL
  LatestJsonURL:
    Description: ホームページ側の data/sentiment.js に書くURL
    Value: !Sub "https://${BucketName}.s3.${AWS::Region}.amazonaws.com/public/latest.json"
  FunctionName:
    Value: !Ref CollectorFunction
