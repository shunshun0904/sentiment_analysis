AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: 株式市場センチメント可視化 — EventBridge + Lambda + S3

Parameters:
  BucketName:
    Type: String
    Description: 履歴JSONとSPAを置くS3バケット名(グローバルで一意)
  IndexId:
    Type: String
    Default: SPX
  IndexName:
    Type: String
    Default: S&P 500
  NewsQuery:
    Type: String
    Default: '"S&P 500" OR "Wall Street" OR "US stocks" OR "Federal Reserve"'
  NewsLanguage:
    Type: String
    Default: en
  ApiTubeKeyParam:
    Type: String
    Default: /market-sentiment/apitube-key
    Description: APITubeキーを格納した SSM SecureString のパラメータ名
  AnthropicKeyParam:
    Type: String
    Default: /market-sentiment/anthropic-key
    Description: フェーズ2で使う Anthropic APIキーのパラメータ名(未使用でも可)
  Scorer:
    Type: String
    Default: passthrough
    AllowedValues: [passthrough, claude, dual]
    Description: passthrough=API付属スコア / claude=Haiku 4.5 / dual=並走保存
  ScheduleExpression:
    Type: String
    Default: rate(5 minutes)
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: >-
      JSONの取得を許すオリジン。ホームページから読むだけなら
      https://shunshun0904.github.io に絞れる。
  HistoryRetentionDays:
    Type: Number
    Default: 400
    MinValue: 2
    Description: >-
      5分刻みの生の履歴を残す日数。過ぎたぶんは自動削除される。
      長期の推移は daily.json に1日1点で畳んであるので、消えるのは細かさだけ。

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 512
    Timeout: 60

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      WebsiteConfiguration:
        IndexDocument: index.html
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        # SPAと公開JSONを静的ホスティングするため、パブリック読み取りを許可する。
        # 独自ドメイン/HTTPSが必要なら CloudFront + OAC に差し替えること。
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, HEAD]
            AllowedOrigins: [!Ref AllowedOrigin]
            AllowedHeaders: ["*"]
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          # 記事キャッシュ。消えても次の実行で取り直すだけなので短く
          - Id: expire-scoring-cache
            Status: Enabled
            Prefix: state/
            ExpirationInDays: 7
          # 5分刻みの生の履歴。日次(daily.json)に畳んだあとは細かさだけの価値なので、
          # ここで自動的に打ち止めにする。daily.json と latest.json はこの規則に触れない。
          - Id: expire-raw-history
            Status: Enabled
            Prefix: !Sub "data/${IndexId}/history/"
            ExpirationInDays: !Ref HistoryRetentionDays
          # 書き損じ(マルチパートの残骸)を溜めない
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 3

  PublicReadPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Statement:
          # 公開するのは SPA と data/ 配下のみ。state/(記事キャッシュ)は非公開。
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource:
              - !Sub "arn:aws:s3:::${BucketName}/index.html"
              - !Sub "arn:aws:s3:::${BucketName}/data/*"

  CollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-collector"
      CodeUri: ../
      Handler: src.handler.lambda_handler
      Description: ニュース取得→重複排除→スコア化→S3更新
      # 5分間隔の単一ジョブ。同時実行を1に固定してキャッシュの競合を防ぐ
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          DATA_BUCKET: !Ref BucketName
          INDEX_ID: !Ref IndexId
          INDEX_NAME: !Ref IndexName
          NEWS_QUERY: !Ref NewsQuery
          NEWS_LANGUAGE: !Ref NewsLanguage
          NEWS_SOURCE: apitube
          SCORER: !Ref Scorer
          APITUBE_KEY_SSM_PARAM: !Ref ApiTubeKeyParam
          ANTHROPIC_KEY_SSM_PARAM: !Ref AnthropicKeyParam
          WINDOW_HOURS: "24"
          HALF_LIFE_HOURS: "6"
          UPDATE_INTERVAL_SECONDS: "300"
          LOG_LEVEL: INFO
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref BucketName
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ApiTubeKeyParam}"
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AnthropicKeyParam}"
      Events:
        Tick:
          Type: Schedule
          Properties:
            Schedule: !Ref ScheduleExpression
            Description: 5分間隔のセンチメント更新

  # ログは放っておくと無期限に残る。14日で足りる(障害の調査はその場でやる)
  CollectorLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-collector"
      RetentionInDays: 14

  # 失敗が続いたら気づけるようにしておく(無料枠内)
  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: センチメント収集Lambdaが連続失敗
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CollectorFunction
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  WebsiteURL:
    Description: SPAのURL
    Value: !GetAtt DataBucket.WebsiteURL
  LatestJsonURL:
    Description: ホームページ側の data/sentiment.js に書くURL
    Value: !Sub "https://${BucketName}.s3.${AWS::Region}.amazonaws.com/data/${IndexId}/latest.json"
  DailyJsonURL:
    Description: 日次に畳んだ長期の推移(生の履歴を消しても残る)
    Value: !Sub "https://${BucketName}.s3.${AWS::Region}.amazonaws.com/data/${IndexId}/daily.json"
  FunctionName:
    Value: !Ref CollectorFunction
